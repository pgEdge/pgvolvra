name: test

# The full matrix is 31 jobs -- six PostgreSQL versions across the main
# battery, examples, concurrency, recovery, and the companion, plus multi-node
# and extension packaging -- and each job starts its own containers.  That is
# not free, so the triggers are deliberately narrow:
#
#   push          only on main, so a feature branch does not run the matrix
#                 twice once its pull request is open.
#   pull_request  on every branch, which is where a regression should be
#                 caught.
#   paths-ignore  a commit touching only documentation cannot break a SQL
#                 suite.  GitHub skips only when *every* changed file matches,
#                 so a mixed commit still runs the full matrix.
#
# It can also be started by hand: the Actions tab, "test", "Run workflow".
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'mkdocs.yml'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

jobs:
  matrix:
    name: PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # one version failing must not hide the others
      matrix:
        pg: ['14', '15', '16', '17', '18', '19']
    steps:
      - uses: actions/checkout@v4

      - name: Run the full suite
        run: ./test/run.sh ${{ matrix.pg }}

      - name: Upload logs
        if: always()            # the logs are the point when it fails
        uses: actions/upload-artifact@v4
        with:
          name: logs-pg${{ matrix.pg }}
          path: test/logs/
          if-no-files-found: warn

  examples:
    name: Examples (PG ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ['14', '15', '16', '17', '18', '19']
    steps:
      - uses: actions/checkout@v4
      - name: Every example, end state asserted
        run: ./test/examples.sh ${{ matrix.pg }}
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: examples-pg${{ matrix.pg }}
          path: test/logs/
          if-no-files-found: warn

  concurrency:
    name: Concurrency (PG ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ['14', '15', '16', '17', '18', '19']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # The two-companions-on-one-slot scenario needs a binary that runs
      # inside the container, not on the runner.
      - name: Build the companion for linux
        run: |
          GOOS=linux GOARCH=amd64 go build -C companion \
            -o "$RUNNER_TEMP/volvra-companion" .
      - name: Parallel sessions, locks, and conflict guard
        env:
          VOLVRA_COMPANION_BIN: ${{ runner.temp }}/volvra-companion
        run: ./test/concurrency.sh ${{ matrix.pg }}
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concurrency-pg${{ matrix.pg }}
          path: test/logs/
          if-no-files-found: warn

  recovery:
    name: Recovery (PG ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ['14', '15', '16', '17', '18', '19']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build the companion for linux
        run: |
          GOOS=linux GOARCH=amd64 go build -C companion \
            -o "$RUNNER_TEMP/volvra-companion" .
      - name: Crashes, SIGKILL, and a full filesystem
        env:
          VOLVRA_COMPANION_BIN: ${{ runner.temp }}/volvra-companion
        run: ./test/recovery.sh ${{ matrix.pg }}
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-pg${{ matrix.pg }}
          path: test/logs/
          if-no-files-found: warn

  multinode:
    name: Multi-node Spock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Two pgEdge nodes, not the postgres image: this is the only suite that
      # needs Spock, and the only place capture of replicated changes can be
      # observed at all.
      - name: Capture across a two-node cluster
        run: ./test/multinode.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multinode
          path: test/logs/
          if-no-files-found: warn

  companion:
    name: Companion (PG ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ['14', '15', '16', '17', '18', '19']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Matches companion/go.mod. Both pglogrepl and pgx/v5 declare
          # go 1.25.0, so the module cannot ask for less.
          go-version: '1.25'
          cache-dependency-path: companion/go.sum
      - name: Vet the companion
        run: cd companion && go vet ./...
      - name: Durable tier, end to end
        run: ./test/companion.sh ${{ matrix.pg }} 5544${{ strategy.job-index }}
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-pg${{ matrix.pg }}
          path: test/logs/
          if-no-files-found: warn

  extension:
    name: CREATE EXTENSION packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and install as an extension
        run: ./extension/build.sh && ./extension/test.sh
